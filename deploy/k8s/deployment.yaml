apiVersion: apps/v1
kind: Deployment
metadata:
  name: medcard-n3health-backend
  namespace: matrixcrm-prod
  labels:
    app: medcard-n3health-backend
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: medcard-n3health-backend
  template:
    metadata:
      labels:
        app: medcard-n3health-backend
    spec:
      # Используем hostNetwork для доступа к VPN интерфейсу
      # ВАЖНО: Это сделает поды доступными напрямую по IP узла
      # Альтернатива: использовать CNI плагин с VPN или сетевые политики
      hostNetwork: false
      dnsPolicy: ClusterFirst
      
      initContainers:
        # Init container для настройки VPN перед запуском основного приложения
        - name: openvpn-init
          image: dperson/openvpn-client:latest
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - SYS_MODULE
            privileged: true
          volumeMounts:
            - name: openvpn-config
              mountPath: /vpn
            - name: openvpn-credentials
              mountPath: /vpn-secrets
          command:
            - /bin/sh
            - -c
            - |
              echo "Preparing OpenVPN configuration..."
              if [ ! -f /vpn-secrets/ca.crt ]; then
                echo "ERROR: ca.crt not found!"
                exit 1
              fi
              echo "OpenVPN configuration files ready"
      
      containers:
        # Sidecar контейнер с OpenVPN клиентом (работает постоянно)
        - name: openvpn-client
          image: dperson/openvpn-client:latest
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - SYS_MODULE
            privileged: true
          volumeMounts:
            - name: openvpn-config
              mountPath: /vpn
            - name: openvpn-credentials
              mountPath: /vpn-secrets
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /tmp/openvpn
              cp /vpn/client.ovpn /tmp/openvpn/client.conf
              cp /vpn-secrets/ca.crt /tmp/openvpn/ca.crt
              cp /vpn-secrets/client.crt /tmp/openvpn/client.crt
              cp /vpn-secrets/client.key /tmp/openvpn/client.key
              cp /vpn-secrets/tls-auth.key /tmp/openvpn/tls-auth.key
              chmod 600 /tmp/openvpn/client.key /tmp/openvpn/tls-auth.key
              chmod 644 /tmp/openvpn/client.crt /tmp/openvpn/ca.crt
              sed -i 's|/etc/openvpn|/tmp/openvpn|g' /tmp/openvpn/client.conf
              printf '%s\n' \
                'nobind' \
                'script-security 2' \
                'up /tmp/openvpn/up.sh' \
                'connect-retry 5' \
                'auth-retry nointeract' \
                'explicit-exit-notify' \
                >> /tmp/openvpn/client.conf
              printf '%s\n' \
                '#!/bin/sh' \
                'VPN_IF=$1' \
                'VPN_IP=$4' \
                'VPN_GW=$(echo "$VPN_IP" | cut -d. -f1-3).1' \
                'echo "VPN up: if=$VPN_IF ip=$VPN_IP gw=$VPN_GW"' \
                'ip route add 10.16.18.45/32 via "$VPN_GW" dev "$VPN_IF" 2>/dev/null || true' \
                'ip route add 10.16.18.50/32 via "$VPN_GW" dev "$VPN_IF" 2>/dev/null || true' \
                'ip route | head -10' \
                > /tmp/openvpn/up.sh
              chmod +x /tmp/openvpn/up.sh
              backoff=8
              while true; do
                echo "Starting OpenVPN client..."
                : > /tmp/openvpn.log
                openvpn --config /tmp/openvpn/client.conf --daemon --log /tmp/openvpn.log --writepid /tmp/openvpn.pid --verb 3
                connected=0
                i=0
                while [ "$i" -lt 45 ]; do
                  if grep -q "Initialization Sequence Completed" /tmp/openvpn.log 2>/dev/null && ip link show tun0 >/dev/null 2>&1; then
                    VPN_IP=$(ip addr show tun0 | grep "inet " | awk '{print $2}' | cut -d/ -f1)
                    echo "VPN connected! IP: $VPN_IP"
                    ip route | head -10
                    connected=1
                    backoff=8
                    break
                  fi
                  if grep -q "AUTH_FAILED" /tmp/openvpn.log 2>/dev/null; then
                    echo "AUTH_FAILED, retry after server releases the session"
                    grep -E "AUTH_FAILED|SIGTERM" /tmp/openvpn.log | tail -5
                    break
                  fi
                  if ! kill -0 "$(cat /tmp/openvpn.pid 2>/dev/null)" 2>/dev/null; then
                    echo "OpenVPN exited before connect"
                    tail -15 /tmp/openvpn.log || true
                    break
                  fi
                  i=$((i + 1))
                  sleep 2
                done
                if [ "$connected" -eq 1 ]; then
                  while kill -0 "$(cat /tmp/openvpn.pid 2>/dev/null)" 2>/dev/null && ip link show tun0 >/dev/null 2>&1; do
                    sleep 10
                  done
                  echo "VPN tunnel dropped, reconnecting"
                fi
                if [ -f /tmp/openvpn.pid ]; then
                  kill "$(cat /tmp/openvpn.pid)" 2>/dev/null || true
                  sleep 1
                  kill -9 "$(cat /tmp/openvpn.pid)" 2>/dev/null || true
                  rm -f /tmp/openvpn.pid
                fi
                echo "Retry in ${backoff}s"
                sleep "$backoff"
                if [ "$backoff" -lt 60 ]; then
                  backoff=$((backoff * 2))
                fi
              done
          readinessProbe:
            exec:
              command: ["/bin/true"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["/bin/true"]
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        
        - name: medcard-n3health-backend
          image: cr.yandex/crpbaq5rr0b32nc3630p/matrix-n3-health-manager:latest
          imagePullPolicy: Always
          command: ["dotnet", "MatrixN3HealthManager.dll"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"

            - name: NEW_RELIC_APP_NAME
              value: "MatrixN3HealthManager"

            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: newrelic-secret
                  key: license-key
                  optional: true

            - name: NEW_RELIC_APPLICATION_LOGGING_ENABLED
              value: "true"

            - name: NEW_RELIC_APPLICATION_LOGGING_FORWARDING_ENABLED
              value: "true"
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: openvpn-config
          configMap:
            name: openvpn-config
        - name: openvpn-credentials
          secret:
            secretName: openvpn-credentials

