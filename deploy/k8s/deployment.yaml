apiVersion: apps/v1
kind: Deployment
metadata:
  name: medcard-n3health-backend
  namespace: matrixcrm-prod
  labels:
    app: medcard-n3health-backend
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: medcard-n3health-backend
  template:
    metadata:
      labels:
        app: medcard-n3health-backend
    spec:
      # Используем hostNetwork для доступа к VPN интерфейсу
      # ВАЖНО: Это сделает поды доступными напрямую по IP узла
      # Альтернатива: использовать CNI плагин с VPN или сетевые политики
      hostNetwork: false
      dnsPolicy: ClusterFirst
      
      initContainers:
        # Init container для настройки VPN перед запуском основного приложения
        - name: openvpn-init
          image: dperson/openvpn-client:latest
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - SYS_MODULE
            privileged: true
          volumeMounts:
            - name: openvpn-config
              mountPath: /vpn
            - name: openvpn-credentials
              mountPath: /vpn-secrets
          command:
            - /bin/sh
            - -c
            - |
              echo "Preparing OpenVPN configuration..."
              if [ ! -f /vpn-secrets/ca.crt ]; then
                echo "ERROR: ca.crt not found!"
                exit 1
              fi
              echo "OpenVPN configuration files ready"
      
      containers:
        # Sidecar контейнер с OpenVPN клиентом (работает постоянно)
        - name: openvpn-client
          image: dperson/openvpn-client:latest
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - SYS_MODULE
            privileged: true
          volumeMounts:
            - name: openvpn-config
              mountPath: /vpn
            - name: openvpn-credentials
              mountPath: /vpn-secrets
          command:
            - /bin/sh
            - -c
            - |
              # Создаем рабочую директорию
              mkdir -p /tmp/openvpn
              # Копируем конфигурацию и сертификаты
              cp /vpn/client.ovpn /tmp/openvpn/client.conf
              cp /vpn-secrets/ca.crt /tmp/openvpn/ca.crt
              cp /vpn-secrets/client.crt /tmp/openvpn/client.crt
              cp /vpn-secrets/client.key /tmp/openvpn/client.key
              cp /vpn-secrets/tls-auth.key /tmp/openvpn/tls-auth.key
              # Исправляем права доступа к ключам (только для владельца)
              chmod 600 /tmp/openvpn/client.key
              chmod 600 /tmp/openvpn/tls-auth.key
              chmod 644 /tmp/openvpn/client.crt
              chmod 644 /tmp/openvpn/ca.crt
              # Обновляем пути в конфигурации
              sed -i 's|/etc/openvpn|/tmp/openvpn|g' /tmp/openvpn/client.conf
              # Добавляем nobind (как в оригинале) и скрипт для применения маршрутов
              echo "nobind" >> /tmp/openvpn/client.conf
              echo "script-security 2" >> /tmp/openvpn/client.conf
              echo "up /tmp/openvpn/up.sh" >> /tmp/openvpn/client.conf
              # Создаем скрипт для применения маршрутов
              # Параметры up script: $1=interface, $2=mtu, $3=link_mtu, $4=local_ip, $5=remote_ip
              echo '#!/bin/sh' > /tmp/openvpn/up.sh
              echo 'VPN_IP=$4' >> /tmp/openvpn/up.sh
              echo 'VPN_GW=$(echo $VPN_IP | cut -d. -f1-3).1' >> /tmp/openvpn/up.sh
              echo 'echo "VPN up script: Interface=$1, IP=$VPN_IP, Gateway=$VPN_GW"' >> /tmp/openvpn/up.sh
              echo '# Применяем маршруты для внутренних серверов через VPN' >> /tmp/openvpn/up.sh
              echo 'ip route add 10.16.18.45/32 via $VPN_GW dev $1 2>/dev/null || true' >> /tmp/openvpn/up.sh
              echo 'ip route add 10.16.18.50/32 via $VPN_GW dev $1 2>/dev/null || true' >> /tmp/openvpn/up.sh
              echo 'echo "Routes applied through VPN"' >> /tmp/openvpn/up.sh
              chmod +x /tmp/openvpn/up.sh
              echo "Starting OpenVPN client..."
              # Запускаем OpenVPN в фоне с логированием
              openvpn --config /tmp/openvpn/client.conf --daemon --log /tmp/openvpn.log --writepid /tmp/openvpn.pid --verb 3
              # Ждем подключения
              echo "Waiting for VPN connection..."
              CONNECTED=0
              for i in {1..90}; do
                if grep -q "Initialization Sequence Completed" /tmp/openvpn.log 2>/dev/null; then
                  if ip link show tun0 > /dev/null 2>&1; then
                    VPN_IP=$(ip addr show tun0 | grep "inet " | awk '{print $2}' | cut -d/ -f1)
                    VPN_GW=$(ip route | grep tun0 | grep "via" | head -1 | awk '{print $3}' || echo "172.26.32.1")
                    echo "VPN connected! IP: $VPN_IP, Gateway: $VPN_GW"
                    echo "Current routes:"
                    ip route | head -10
                    CONNECTED=1
                    break
                  fi
                fi
                if grep -q "AUTH_FAILED" /tmp/openvpn.log 2>/dev/null; then
                  echo "ERROR: AUTH_FAILED - VPN server rejected connection"
                  echo "This usually means:"
                  echo "1. Another connection with same certificate is active (disconnect local VPN)"
                  echo "2. VPN server doesn't allow multiple connections"
                  echo "3. Certificate issue"
                  cat /tmp/openvpn.log | grep -A 5 "AUTH_FAILED" | tail -10
                  # Продолжаем работать без VPN
                  break
                fi
                sleep 2
              done
              if [ $CONNECTED -eq 0 ]; then
                echo "WARNING: VPN did not connect"
                echo "Last 20 lines of log:"
                tail -20 /tmp/openvpn.log || true
              fi
              # Держим контейнер живым
              tail -f /tmp/openvpn.log 2>/dev/null || sleep infinity
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        
        - name: medcard-n3health-backend
          image: cr.yandex/crpbaq5rr0b32nc3630p/matrix-n3-health-manager:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: openvpn-config
          configMap:
            name: openvpn-config
        - name: openvpn-credentials
          secret:
            secretName: openvpn-credentials

